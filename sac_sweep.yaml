name: sac-sweep
method: grid  # or "random" or "bayes", if we use a metric then bayes
program: train_sweep.py
# metric:
#   name: Reward
#   goal: maximize
# metric:
#   name: Rebalancing Cost
#   goal: minimize

parameters:
  model.wandb: 
    value: true
  simulator.name:
    value: macro
  simulator.city:
    value: nyc_brooklyn


  model.alpha:
    values: [0.01, 0.05, 0.1, 0.3, 0.5, 0.8]
  model.batch_size:
    values: [100, 256, 525]
  model.hidden_size:
    values: [128, 256] 
  model.only_q_steps:
    values: [0, 10, 100]